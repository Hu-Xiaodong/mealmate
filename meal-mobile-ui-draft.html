    );

    #meal-mobile-ui-draft * { box-sizing:border-box; }
    #meal-mobile-ui-draft [hidden] { display:none !important; }
    #meal-mobile-ui-draft .meal-stage { padding:44px 12px 20px; }
    #meal-mobile-ui-draft .meal-phone { width:100%; max-width:390px; height:780px; margin:auto; position:relative; display:grid; grid-template-rows:auto minmax(0,1fr) auto; background:var(--meal-bg); border:1px solid var(--meal-line); border-radius:28px; overflow:hidden; font-size:15px; line-height:1.6; box-shadow:0 12px 40px color-mix(in srgb,var(--meal-ink) 6%,transparent); }
    #meal-mobile-ui-draft button, #meal-mobile-ui-draft input, #meal-mobile-ui-draft textarea { font:inherit; color:inherit; }
    #meal-mobile-ui-draft button { display:inline-flex; align-items:center; justify-content:center; gap:5px; min-height:44px; border:1px solid var(--meal-line); background:var(--meal-bg); border-radius:12px; padding:8px 12px; touch-action:manipulation; transition:background 120ms ease; }
    #meal-mobile-ui-draft button &gt; svg { vertical-align:middle; flex-shrink:0; }
    #meal-mobile-ui-draft button &gt; svg + span { margin-left:0; }
    #meal-mobile-ui-draft button:active { background:var(--meal-soft); }
    #meal-mobile-ui-draft button:disabled { opacity:.55; }
    #meal-mobile-ui-draft .meal-demo-label { font-size:11px; line-height:1.5; text-align:center; color:var(--meal-sub); padding:0 4px 12px; }
    #meal-mobile-ui-draft .meal-header { display:flex; align-items:center; gap:12px; justify-content:space-between; padding:16px; min-height:76px; }
    #meal-mobile-ui-draft .meal-header &gt; h2 { flex:1; }
    #meal-mobile-ui-draft .meal-header &gt; button { font-size:14px; }
    #meal-mobile-ui-draft .meal-header &gt; .meal-primary { border-radius:24px; padding:8px 15px; }
    #meal-mobile-ui-draft h2 { font-size:23px; line-height:1.35; font-weight:500; margin:0; }
    #meal-mobile-ui-draft h3 { font-size:17px; line-height:1.5; font-weight:500; margin:0 0 10px; }
    #meal-mobile-ui-draft p { margin:0 0 12px; }
    #meal-mobile-ui-draft .meal-content { overflow-y:auto; overscroll-behavior:contain; padding:0 16px 88px; scrollbar-width:thin; scrollbar-color:var(--meal-line) transparent; }
    #meal-mobile-ui-draft .meal-sub { font-size:13px; color:var(--meal-sub); }
    #meal-mobile-ui-draft .meal-primary { background:var(--meal-selected); color:var(--meal-on-selected); border-color:var(--meal-selected); }
    #meal-mobile-ui-draft button[aria-pressed=&quot;true&quot;] { background:var(--meal-tint); color:var(--meal-ink); border-color:transparent; }
    #meal-mobile-ui-draft .meal-chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 16px; }
    #meal-mobile-ui-draft .meal-chips button { font-size:13px; padding:7px 12px; border-radius:22px; border-color:transparent; background:var(--meal-soft); }
    #meal-mobile-ui-draft .meal-chips button[aria-pressed=&quot;true&quot;] { background:var(--meal-tint); font-weight:500; box-shadow:inset 0 -2px var(--meal-selected); }
    #meal-mobile-ui-draft .meal-feed { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px 12px; }
    #meal-mobile-ui-draft .meal-feed.is-list { grid-template-columns:1fr; }
    #meal-mobile-ui-draft .meal-post { min-width:0; }
    #meal-mobile-ui-draft .meal-preview { display:block; width:100%; border:0; padding:0; text-align:left; background:transparent; }
    #meal-mobile-ui-draft .meal-media { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:104px; aspect-ratio:4/5; background:var(--meal-soft); color:var(--meal-sub); border-radius:12px; overflow-wrap:anywhere; padding:12px; text-align:center; font-size:13px; }
    #meal-mobile-ui-draft .meal-food { position:relative; overflow:hidden; padding:0; }
    #meal-mobile-ui-draft .meal-food-crop { position:absolute; top:0; left:50%; height:100%; width:auto; aspect-ratio:3/2; transform:translateX(-50%) scale(var(--meal-photo-zoom,1.08)); background-image:var(--meal-food-atlas); background-size:200% 300%; background-position:var(--meal-photo-x) var(--meal-photo-y); }
    #meal-mobile-ui-draft .meal-media strong { font-weight:500; color:var(--meal-ink); font-size:15px; }
    #meal-mobile-ui-draft .meal-post-title { display:block; font-size:16px; font-weight:500; margin:9px 0 3px; }
    #meal-mobile-ui-draft .meal-quote { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; color:var(--meal-sub); font-size:13px; line-height:1.5; }
    #meal-mobile-ui-draft .meal-source-tag { position:absolute; top:8px; left:8px; background:var(--meal-bg); color:var(--meal-ink); padding:2px 8px; border-radius:6px; font-size:11px; }
    #meal-mobile-ui-draft .meal-post-footer { display:flex; align-items:center; justify-content:space-between; gap:4px; margin-top:5px; flex-wrap:wrap; font-size:12px; color:var(--meal-sub); }
    #meal-mobile-ui-draft .meal-like { font-size:13px; border:0; padding:4px 0 4px 7px; min-width:54px; background:transparent; white-space:nowrap; }
    #meal-mobile-ui-draft .meal-like[aria-pressed=&quot;true&quot;] { background:transparent; color:var(--meal-selected); }
    #meal-mobile-ui-draft .meal-like[aria-pressed=&quot;true&quot;] &gt; svg { fill:currentColor; }
    #meal-mobile-ui-draft .meal-nav { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; padding:8px 10px 15px; border-top:1px solid var(--meal-line); background:var(--meal-bg); }
    #meal-mobile-ui-draft .meal-nav button { display:flex; flex-direction:column; align-items:center; gap:3px; border:0; border-radius:8px; padding:6px 4px; font-size:11px; color:var(--meal-sub); }
    #meal-mobile-ui-draft .meal-nav button &gt; svg + span { margin-left:0; }
    #meal-mobile-ui-draft .meal-nav button[aria-current=&quot;page&quot;] { font-weight:500; color:var(--meal-selected); background:transparent; }
    #meal-mobile-ui-draft .meal-page-lead { margin:0 0 12px; }
    #meal-mobile-ui-draft .meal-page-lead &gt; h3 { margin-bottom:3px; }
    #meal-mobile-ui-draft .meal-rank-row { display:grid; grid-template-columns:88px minmax(0,1fr); gap:12px; padding:16px 0; border-bottom:1px solid var(--meal-line); align-items:center; }
    #meal-mobile-ui-draft .meal-rank-image { position:relative; }
    #meal-mobile-ui-draft .meal-rank-row .meal-media { min-height:88px; height:88px; padding:0; font-size:11px; aspect-ratio:1; }

      return post.likes + (state.liked.includes(post.id) ? 1 : 0);
    }
    // 收藏同时容纳饭帖和菜谱，但用类型前缀区分，避免数字编号相同导致混淆。
    function saveKey(kind, id) {
      return kind + ':' + id;
    }
    // 原型的数据量很小，按统一数据源查找可避免详情与列表显示不同内容。
    function findItem(kind, id) {
      return (kind === 'recipe' ? recipes : posts).find(function(item) { return item.id === Number(id); });
    }
    // 只有约定的三个场景可叫出 AI，避免悬钮成为每页都挡内容的装饰。
    function aiAllowed() {

    }
    // 明示当前参考对象，让用户知道 AI 会围绕哪份饭或哪个页面作答。
    function currentContext() {
      if (state.page === 'post') {
        const post = findItem('post',state.id);
        return {key:'post:' + post.id,label:post.title,page:'post',id:post.id};
      }
      return state.page === 'recipes' ? {key:'recipes',label:'菜谱 · 快手家常菜',page:'recipes'} : {key:'home',label:'首页 · 帮你选饭',page:'home'};
    }

    function greeting(context) {

      if (context.page === 'recipes') return '这里都是快手家常菜。告诉我你的食材、口味和时间，我可以帮你挑菜、搭配一顿饭。';
      return '今天想吃什么？告诉我口味、预算或能用多久，我帮你缩小选择。也可以直接说家里有什么食材。';
    }
    // 简短状态提示不会清空表单或改变浏览位置，便于连续体验。
    function notify(message) {

      notice.textContent = message;
      notice.hidden = false;
      noticeTimer = setTimeout(function() { notice.hidden = true; },2600);
    }
    // 宿主保存是可选能力，接口缺失、同步异常或返回非 Promise 都不能打断页面交互。
    function persist() {
      const snapshot = {
        modelContent:{prototype:'番茄橙红移动端UI稿',tab:state.tab,page:state.page,likedCount:state.liked.length,savedCount:state.saved.length},
        privateContent:{uiVersion:'tomato-ui-v1',tab:state.tab,page:state.page,id:state.id,liked:state.liked,saved:state.saved,homeFilter:state.homeFilter,recipeFilter:state.recipeFilter,mineFilter:state.mineFilter,fabPosition:state.fabPosition,aiHintSeen:state.aiHintSeen,aiUsed:state.aiUsed}
      };
      lastPersistedState = JSON.stringify(snapshot.privateContent);
      try {
        const bridge = window.openai;
        if (!bridge || typeof bridge.setWidgetState !== 'function') return;
        Promise.resolve(bridge.setWidgetState(snapshot)).catch(function() {});
      } catch {

      }

    // 仅恢复已知的视图与样例编号，过期或不完整的状态不会阻止原型打开。
    function restore(saved) {
      const data = saved &amp;&amp; saved.privateContent;
      if (!data || typeof data !== 'object' || data.uiVersion!=='tomato-ui-v1') return;
      if (['home','hot','recipes','mine'].includes(data.tab)) state.tab = data.tab;
      state.page = state.tab;
      if (['post','recipe'].includes(data.page) &amp;&amp; findItem(data.page,data.id)) {
        state.page = data.page;
        state.id = Number(data.id);
        state.stack = [{page:state.tab,id:null}];
      }
      if (data.page === 'publish') {
        state.page = 'publish';
        state.id = null;
        state.stack = [{page:state.tab,id:null}];
      }
      state.liked = Array.isArray(data.liked) ? data.liked.filter(function(id) { return posts.some(function(post) { return post.id === id; }); }) : [];
      state.saved = Array.isArray(data.saved) ? data.saved.filter(function(key) { return typeof key === 'string' &amp;&amp; /^(post|recipe):\d+$/.test(key); }) : [];
      if (['all','near'].includes(data.homeFilter)) state.homeFilter = data.homeFilter;
      if (['all','quick','pot','few'].includes(data.recipeFilter)) state.recipeFilter = data.recipeFilter;
      if (['posts','saved'].includes(data.mineFilter)) state.mineFilter = data.mineFilter;
      if (data.fabPosition &amp;&amp; Number.isFinite(data.fabPosition.x) &amp;&amp; Number.isFinite(data.fabPosition.y)) state.fabPosition = data.fabPosition;
      state.aiHintSeen = state.aiHintSeen || data.aiHintSeen===true;

    // 每个页面独立记住滚动位置，查看详情和返回时不会丢掉之前看到的饭。
    function pageKey() {
      return state.page + ':' + (state.id || '') + ':' + (state.page === 'mine' ? state.mineFilter : '');
    }
    // 导航与发布等动作分开处理，底部始终只有已确认的四个栏目。
    function navigate(page, id, isTab) {
      if (state.page==='login' &amp;&amp; page!=='login') { pendingAuth=null; loginDraft={phone:'',code:'',consent:false,sentPhone:'',nextSendAt:0}; }
      state.scroll[pageKey()] = content.scrollTop;
      if (state.page!==page || state.id!==Number(id)) gallerySession = {id:null,manuallyStopped:false};
      if (isTab) {
        state.tab = page;
        state.stack = [];
      } else {
        state.stack.push({page:state.page,id:state.id});
      }
      state.page = page;
      state.id = id == null ? null : Number(id);
      state.chatOpen = false;
      render();
      content.scrollTop = state.scroll[pageKey()] || 0;
      persist();
    }
    // 显式返回上一层，保留来源于首页、榜单或收藏的路径。
    function goBack() {
      const resumeGallery = state.page==='login' &amp;&amp; pendingAuth ? pendingAuth.gallerySession : null;
      if (state.page==='login') { pendingAuth=null; loginDraft={phone:'',code:'',consent:false,sentPhone:'',nextSendAt:0}; }
      state.scroll[pageKey()] = content.scrollTop;
      const previous = state.stack.pop() || {page:state.tab,id:null};
      state.page = previous.page;
      state.id = previous.id;
      gallerySession = resumeGallery || {id:null,manuallyStopped:false};
      state.chatOpen = false;

      content.scrollTop = state.scroll[pageKey()] || 0;

      if (first) first.focus({preventScroll:true});
      persist();

    // 同一份饭帖组件复用于首页和“我的”，减少交互差异和重复逻辑。
    function postCard(post) {
      const liked = state.liked.includes(post.id);
      return '&lt;article class=&quot;meal-post&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;meal-preview cursor-interaction&quot; data-action=&quot;post&quot; data-value=&quot;' + post.id + '&quot; aria-label=&quot;查看' + escapeText(post.title) + '&quot;&gt;' +
        postCover(post) + '&lt;span class=&quot;meal-post-title&quot;&gt;' + escapeText(post.title) + '&lt;/span&gt;&lt;span class=&quot;meal-quote&quot;&gt;' + escapeText(post.review) + '&lt;/span&gt;&lt;/button&gt;' +
        '&lt;div class=&quot;meal-post-footer&quot;&gt;&lt;span&gt;' + escapeText(post.author) + '&lt;/span&gt;' + button('赞 · ' + likeCount(post),'like',post.id,'class=&quot;meal-like cursor-interaction&quot; aria-label=&quot;' + escapeText((liked ? '取消点赞' : '点赞，我也想吃') + '：' + post.title) + '&quot; aria-pressed=&quot;' + liked + '&quot;') + '&lt;/div&gt;&lt;/article&gt;';

    // 小型分类可选，默认直接有菜可看，不要求先填食材、器具和时间。
    function chip(label,action,value,selected) {

    }
    // 热榜严格只展示当天、至少有一赞的饭帖，条数不足时不补假数据。
    function rankedPosts() {

    }
    // 简短菜谱卡直接展示总耗时与器具，帮助用户不用进入筛选就判断是否能做。
    function recipeCard(recipe) {
      return '&lt;article class=&quot;meal-recipe-row&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;meal-preview cursor-interaction&quot; data-action=&quot;recipe&quot; data-value=&quot;' + recipe.id + '&quot; aria-label=&quot;查看菜谱：' + escapeText(recipe.title) + '&quot;&gt;' +
        imageBlock(recipe.title,'成品图') + '&lt;span&gt;&lt;span class=&quot;meal-post-title&quot;&gt;' + escapeText(recipe.title) + '&lt;/span&gt;&lt;span class=&quot;meal-recipe-time&quot;&gt;' + recipe.time + '分钟&lt;/span&gt;&lt;span class=&quot;meal-sub&quot;&gt; · ' + escapeText(recipe.tool) + '&lt;/span&gt;' + ingredientTags(recipe,null) + '&lt;/span&gt;&lt;/button&gt;&lt;/article&gt;';

    function savedCard(key) {
      const parts = key.split(':');

    // 登录只是当前预览的模拟会话，手机号和验证码不写入宿主保存状态。
    function requestLogin(action,value) {

    // 登录失败保留当前填写内容，避免校验一次就要求重新输入手机号或验证码。

    // 演示码固定且明示，不调用短信接口；换手机号后必须重新获取，避免串用验证码。
    function sendLoginCode() {
      captureLoginDraft();
      if (!/^1\d{10}$/.test(loginDraft.phone)) return loginError('请输入11位、以1开头的手机号。','meal-login-phone');
      if (loginDraft.nextSendAt&gt;Date.now()) return;
      loginDraft.sentPhone=loginDraft.phone;

      render();
      notify('演示验证码为123456，不会发送真实短信。');

      if (loginDraft.sentPhone!==loginDraft.phone) return loginError('请先为当前手机号获取演示验证码。','meal-login-phone');
      if (Date.now()&gt;loginDraft.nextSendAt+240000) return loginError('演示验证码已过期，请重新获取。','meal-login-code');
      if (!/^\d{6}$/.test(loginDraft.code) || loginDraft.code!=='123456') return loginError('演示验证码不正确，请输入123456。','meal-login-code');

    // 登录续办与正常点按共用点赞动作，保证计数和热榜只更新一次。

          visible.map(recipeCard).join('');

        if (!auth.signedIn) return profile+tabs+'&lt;div class=&quot;meal-empty&quot;&gt;'+icon('user-round')+'&lt;p&gt;登录后查看我的'+(state.mineFilter==='posts' ? '发布':'收藏')+'。&lt;/p&gt;'+button('去登录','login','','class=&quot;meal-primary cursor-interaction&quot;')+'&lt;/div&gt;';

    // 发送后使用明确的示例回复展示结果卡片，长消息不会自动把用户滚到末尾。

      state.messages = state.messages.slice(-16);

      const messages = chat.querySelector('.meal-messages');
      const bubbles = messages.querySelectorAll('.meal-bubble');
      const latest = bubbles[bubbles.length-1];

    // 保存草稿后再重画选择按钮，避免选择来源或图片时丢掉已经写好的评价。

    // 拖动位置限制在内容区域内，保证悬钮不会压住底栏或跑出手机边框。
    function placeFab() {
      if (state.fabPosition) {
        const size = fab.offsetWidth || 48;
        const x = Math.max(8,Math.min(phone.clientWidth-size-8,state.fabPosition.x));
        const y = Math.max(header.offsetHeight+8,Math.min(phone.clientHeight-root.querySelector('.meal-nav').offsetHeight-size-12,state.fabPosition.y));
        state.fabPosition = {x:x,y:y};
        fab.style.left = x+'px';
        fab.style.top = y+'px';

        fab.style.bottom = 'auto';
      }
      if (!hint.hidden) placeAiHint();

    // 提示跟随悬钮停靠；侧边不足以放下时移到上方，避免提示压住入口或超出手机。
    function placeAiHint() {
      const box = fab.getBoundingClientRect();
      const parent = phone.getBoundingClientRect();
      const width = hint.offsetWidth;
      let left = box.left-parent.left-width-8;
      let top = box.top-parent.top+(box.height-hint.offsetHeight)/2;
      if (left&lt;8) left = box.right-parent.left+8;
      if (left+width&gt;phone.clientWidth-8) { left=(phone.clientWidth-width)/2; top=box.top-parent.top-hint.offsetHeight-8; }
      hint.style.left = Math.max(8,Math.min(phone.clientWidth-width-8,left))+'px';
      hint.style.top = Math.max(header.offsetHeight+8,Math.min(phone.clientHeight-root.querySelector('.meal-nav').offsetHeight-hint.offsetHeight-8,top))+'px';
    }
    // 提示收起后原来的 AI 入口一直可用，不用让用户追赶会消失的操作机会。
    function hideAiHint() {

      hintHideTimer = null;
      hint.hidden = true;

    // 仅首次首页停留十秒后轻提示一次；切页、输入、后台或拖动时取消等待。
    function refreshAiHint() {
      const active = document.activeElement;
      const typing = active &amp;&amp; root.contains(active) &amp;&amp; ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
      const available = root.isConnected &amp;&amp; state.page==='home' &amp;&amp; !state.chatOpen &amp;&amp; !document.hidden &amp;&amp; !typing &amp;&amp; !drag &amp;&amp; !state.aiUsed;
      if (!available) hideAiHint();
      if (!available || state.aiHintSeen) {
        clearTimeout(hintShowTimer);
        hintShowTimer = null;
        return;
      }
      if (hintShowTimer!==null) return;
      hintShowTimer = setTimeout(function() {
        hintShowTimer = null;
        if (!root.isConnected || state.page!=='home' || state.chatOpen || document.hidden || state.aiUsed || drag) return;
        state.aiHintSeen = true;
        hint.hidden = false;
        placeAiHint();
        hintHideTimer = setTimeout(hideAiHint,4000);
      },10000);
    }
    // 操作分发只处理原型内动作，不触发外部跳转或真实发布。
    function handleAction(event) {
      const trigger = event.target.closest('[data-action]');
      if (!trigger || !root.contains(trigger)) return;
      const action = trigger.dataset.action;
      const value = trigger.dataset.value;
      if (action==='tab') return navigate(value,null,true);
      if (action==='post' || action==='recipe') return navigate(action,value,false);
      if (action==='back') return goBack();
      if (action==='publish') return navigate('publish',null,false);
      if (action==='login') return requestLogin();
      if (action==='logout') return logout();
      if (action==='send-code') return sendLoginCode();
      if (action==='complete-login') return completeLogin();
      if (action==='gallery-step') { if (galleryRuntime) galleryRuntime.move(1,true); return; }
      if (action==='hint-open') return openAI();
      if (action==='hint-dismiss') { state.aiHintSeen=true; hideAiHint(); refreshAiHint(); persist(); fab.focus({preventScroll:true}); return; }

        if (!requestLogin('like',value)) toggleLike(value);

      }
      if (action==='save') {
        if (!requestLogin('save',value)) toggleSave(value);
        return;

      selectTab(tab);
      return;

      tab.closest('[role=&quot;tablist&quot;]').querySelectorAll('[role=&quot;tab&quot;]'),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);

      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
